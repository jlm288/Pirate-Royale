<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dead Reckoning — Join</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap');

  :root {
    --bg: #060d1a;
    --panel: #0d1f35;
    --border: rgba(201,138,26,0.4);
    --gold: #f0b429;
    --gold2: #c98a1a;
    --crimson: #9b1c1c;
    --parchment: #f2e4c4;
    --foam: #a8d8ea;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'Crimson Pro', serif;
    color: var(--parchment);
    touch-action: none;
  }

  /* ── SCREENS ── */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; transition: opacity 0.4s; }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ── JOIN SCREEN ── */
  #join-screen { gap: 1.2rem; }

  .skull-icon { font-size: 3.5rem; animation: float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  h1.game-title {
    font-family: 'Pirata One', cursive;
    font-size: 2.2rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(240,180,41,0.5);
    text-align: center;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(242,228,196,0.4);
    font-style: italic;
  }

  .name-input {
    width: 100%;
    max-width: 300px;
    padding: 0.85rem 1.2rem;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Pirata One', cursive;
    font-size: 1.2rem;
    color: var(--gold);
    text-align: center;
    outline: none;
    letter-spacing: 0.05em;
  }
  .name-input::placeholder { color: rgba(201,138,26,0.3); }
  .name-input:focus { border-color: var(--gold); }

  .join-btn {
    font-family: 'Pirata One', cursive;
    font-size: 1.3rem;
    color: #1a0f00;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none;
    padding: 0.85rem 2.5rem;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.08em;
    box-shadow: 0 4px 20px rgba(240,180,41,0.35);
    width: 100%;
    max-width: 300px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .join-btn:active { transform: scale(0.97); }

  /* ── LOBBY SCREEN ── */
  #lobby-screen { gap: 1rem; text-align: center; }

  .player-badge {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    border: 3px solid;
    box-shadow: 0 0 24px currentColor;
    animation: pulse-badge 2s ease-in-out infinite;
  }
  @keyframes pulse-badge { 0%,100%{box-shadow:0 0 16px currentColor} 50%{box-shadow:0 0 32px currentColor} }

  .player-name-display {
    font-family: 'Pirata One', cursive;
    font-size: 1.8rem;
    color: var(--gold);
  }

  .lobby-status {
    font-size: 0.85rem;
    color: rgba(242,228,196,0.5);
    font-style: italic;
    letter-spacing: 0.1em;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

  .player-count-display {
    font-family: 'Pirata One', cursive;
    font-size: 1rem;
    color: var(--gold2);
    letter-spacing: 0.1em;
  }

  .start-btn {
    font-family: 'Pirata One', cursive;
    font-size: 1.1rem;
    color: #1a0f00;
    background: linear-gradient(135deg, #2ecc71, #1a9e55);
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    max-width: 260px;
    box-shadow: 0 4px 16px rgba(46,204,113,0.3);
  }
  .start-btn:active { transform: scale(0.97); }

  /* ── GAME SCREEN ── */
  #game-screen { padding: 0; justify-content: flex-start; }

  #game-hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    background: rgba(6,13,26,0.9);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .hud-hp { font-size: 1.1rem; letter-spacing: 2px; }
  .hud-score { font-family: 'Pirata One', cursive; font-size: 1rem; color: var(--gold); }
  .hud-kills { font-family: 'Pirata One', cursive; font-size: 0.9rem; color: #e74c3c; }

  #kill-feed {
    width: 100%;
    padding: 0.3rem 1rem;
    min-height: 2rem;
    background: rgba(6,13,26,0.7);
    border-bottom: 1px solid rgba(201,138,26,0.15);
    flex-shrink: 0;
  }
  .kill-msg {
    font-size: 0.72rem;
    color: rgba(242,228,196,0.6);
    font-style: italic;
    letter-spacing: 0.05em;
    animation: fadeKill 4s forwards;
  }
  @keyframes fadeKill { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }

  #controls-area {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    padding: 0.5rem;
    gap: 0.5rem;
    position: relative;
  }

  /* Joystick */
  #joystick-zone {
    width: 100%;
    flex: 1;
    position: relative;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 1.5rem;
  }

  #joystick-base {
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 2px solid rgba(201,138,26,0.3);
    background: rgba(13,31,53,0.5);
    position: relative;
    pointer-events: none;
  }

  #joystick-knob {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(240,180,41,0.9), rgba(201,138,26,0.7));
    border: 2px solid var(--gold);
    box-shadow: 0 0 16px rgba(240,180,41,0.4);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: box-shadow 0.1s;
  }

  /* Fire button */
  #fire-zone {
    position: absolute;
    right: 1.5rem;
    bottom: 1.5rem;
    width: 90px; height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c0392b, #7b241c);
    border: 3px solid #e74c3c;
    box-shadow: 0 0 24px rgba(231,76,60,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem;
    cursor: pointer;
    touch-action: none;
    transition: transform 0.08s, box-shadow 0.08s;
    flex-shrink: 0;
  }
  #fire-zone:active, #fire-zone.firing { transform: scale(0.92); box-shadow: 0 0 40px rgba(231,76,60,0.8); }
  #fire-zone.reloading { opacity: 0.4; }

  /* Aim indicator */
  #aim-label {
    position: absolute;
    top: 0.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(242,228,196,0.25);
    font-style: italic;
    white-space: nowrap;
  }

  /* ── DEAD SCREEN ── */
  #dead-screen { gap: 1rem; text-align: center; }

  .dead-icon { font-size: 4rem; animation: spin-slow 6s linear infinite; }
  @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .dead-title {
    font-family: 'Pirata One', cursive;
    font-size: 2rem;
    color: #e74c3c;
    text-shadow: 0 0 20px rgba(231,76,60,0.5);
  }

  .dead-stats {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    width: 100%;
    max-width: 280px;
  }

  .stat-row { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.9rem; }
  .stat-label { color: rgba(242,228,196,0.5); font-style: italic; }
  .stat-val { font-family: 'Pirata One', cursive; color: var(--gold); }

  /* ── WINNER SCREEN ── */
  #winner-screen { gap: 1rem; text-align: center; }

  .trophy { font-size: 3.5rem; animation: float 2s ease-in-out infinite; }

  .winner-title {
    font-family: 'Pirata One', cursive;
    font-size: 1.6rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(240,180,41,0.6);
  }

  .winner-name {
    font-family: 'Pirata One', cursive;
    font-size: 2.4rem;
    text-shadow: 0 0 30px currentColor;
  }

  .leaderboard {
    width: 100%;
    max-width: 300px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .lb-header {
    background: rgba(201,138,26,0.15);
    padding: 0.4rem 1rem;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold2);
    display: flex;
    justify-content: space-between;
  }

  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    border-top: 1px solid rgba(201,138,26,0.1);
    font-size: 0.85rem;
  }

  .lb-rank { color: var(--gold2); font-family: 'Pirata One', cursive; width: 20px; }
  .lb-name { flex: 1; padding: 0 0.5rem; }
  .lb-kills { color: #e74c3c; font-family: 'Pirata One', cursive; width: 30px; text-align: center; }
  .lb-score { color: var(--gold); font-family: 'Pirata One', cursive; width: 40px; text-align: right; }

  .notification {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Pirata One', cursive;
    font-size: 1.8rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(240,180,41,0.8);
    pointer-events: none;
    z-index: 100;
    text-align: center;
    animation: notif-pop 0.6s ease-out forwards;
  }
  @keyframes notif-pop { 0%{transform:translate(-50%,-50%) scale(0.5);opacity:0} 40%{transform:translate(-50%,-60%) scale(1.1);opacity:1} 100%{transform:translate(-50%,-70%) scale(1);opacity:0} }
</style>
</head>
<body>

<!-- JOIN -->
<div class="screen" id="join-screen">
  <div class="skull-icon">☠️</div>
  <h1 class="game-title">Dead<br>Reckoning</h1>
  <div class="subtitle">Pirate Battle Royale</div>
  <input class="name-input" id="name-input" type="text" placeholder="Your pirate name..." maxlength="16" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="join-btn" id="join-btn">⚓ Board the Ship</button>
</div>

<!-- LOBBY -->
<div class="screen hidden" id="lobby-screen">
  <div class="player-badge" id="player-badge">🏴‍☠️</div>
  <div class="player-name-display" id="player-name-display"></div>
  <div class="player-count-display" id="player-count-display">1 pirate aboard</div>
  <div class="lobby-status" id="lobby-status">Waiting for the captain to start...</div>
  <button class="start-btn" id="start-btn">⚔️ Start Battle!</button>
  <div style="font-size:0.7rem;color:rgba(242,228,196,0.25);font-style:italic;margin-top:0.5rem">anyone can start</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="game-screen">
  <div id="game-hud">
    <div class="hud-hp" id="hud-hp">❤️❤️❤️</div>
    <div class="hud-score">🪙 <span id="hud-score">0</span></div>
    <div class="hud-kills">💀 <span id="hud-kills">0</span></div>
  </div>
  <div id="kill-feed"></div>
  <div id="controls-area">
    <div id="aim-label">drag to move · tap cannon to fire</div>
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="fire-zone">💣</div>
  </div>
</div>

<!-- DEAD -->
<div class="screen hidden" id="dead-screen">
  <div class="dead-icon">💀</div>
  <div class="dead-title">Ye Been Sunk!</div>
  <div class="dead-stats" id="dead-stats"></div>
  <div class="lobby-status">Watching the battle unfold...</div>
</div>

<!-- WINNER -->
<div class="screen hidden" id="winner-screen">
  <div class="trophy">🏆</div>
  <div class="winner-title">Last Pirate Standing!</div>
  <div class="winner-name" id="winner-name"></div>
  <div class="leaderboard" id="leaderboard"></div>
  <button class="join-btn" id="play-again-btn" style="margin-top:0.5rem">Play Again</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myId = null, myPlayer = null, gameStateVal = 'lobby';
let canFire = true;

// ── Screen management ──
const screens = {
  join: document.getElementById('join-screen'),
  lobby: document.getElementById('lobby-screen'),
  game: document.getElementById('game-screen'),
  dead: document.getElementById('dead-screen'),
  winner: document.getElementById('winner-screen'),
};

function show(name) {
  Object.entries(screens).forEach(([k,v]) => v.classList.toggle('hidden', k !== name));
}

// ── Join ──
document.getElementById('join-btn').addEventListener('click', joinGame);
document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') joinGame(); });

function joinGame() {
  const name = document.getElementById('name-input').value.trim();
  socket.emit('join', { name });
}

socket.on('joined', ({ id, player }) => {
  myId = id;
  myPlayer = player;
  const badge = document.getElementById('player-badge');
  badge.style.color = player.color;
  badge.style.borderColor = player.color;
  document.getElementById('player-name-display').textContent = player.name;
  document.getElementById('player-name-display').style.color = player.color;
  show('lobby');
});

socket.on('playerJoined', ({ name, count }) => {
  document.getElementById('player-count-display').textContent = `${count} pirate${count!==1?'s':''} aboard`;
  showNotif(`⚓ ${name} joined!`);
});

socket.on('playerLeft', ({ name, count }) => {
  document.getElementById('player-count-display').textContent = `${count} pirate${count!==1?'s':''} aboard`;
});

// ── Start ──
document.getElementById('start-btn').addEventListener('click', () => socket.emit('startGame'));

socket.on('countdown', n => {
  document.getElementById('lobby-status').textContent = n > 0 ? `Battle starts in ${n}...` : 'FIGHT!';
  showNotif(n > 0 ? `${n}` : '⚔️ FIGHT!');
});

socket.on('gameStart', () => {
  gameStateVal = 'playing';
  canFire = true;
  show('game');
  updateHUD({ hp: 3, score: 0, kills: 0 });
});

// ── Game updates ──
socket.on('tick', (state) => {
  if (!myId) return;
  const me = state.players[myId];
  if (me) {
    myPlayer = me;
    updateHUD(me);
  }
});

socket.on('hit', ({ targetId, shooterId, hp }) => {
  if (targetId === myId) {
    updateHUD({ ...myPlayer, hp });
    showNotif('💥 HIT!');
  }
  if (shooterId === myId) showNotif('🎯 +25');
});

socket.on('lootPickup', ({ playerId, type, value }) => {
  if (playerId === myId) {
    showNotif(type === 'health' ? '❤️ Healed!' : `🪙 +${value}`);
  }
});

socket.on('playerDied', ({ id, killedBy }) => {
  addKillFeed(`${id === myId ? 'You were' : 'A pirate was'} sunk by ${killedBy}`);
  if (id === myId) {
    setTimeout(() => show('dead'), 800);
    document.getElementById('dead-stats').innerHTML = `
      <div class="stat-row"><span class="stat-label">Ships sunk</span><span class="stat-val">${myPlayer?.kills||0}</span></div>
      <div class="stat-row"><span class="stat-label">Doubloons</span><span class="stat-val">${myPlayer?.score||0}</span></div>
      <div class="stat-row"><span class="stat-label">Cause of death</span><span class="stat-val">${killedBy}</span></div>
    `;
  }
});

socket.on('fired', ({ ownerId }) => {
  if (ownerId === myId) {
    canFire = false;
    const btn = document.getElementById('fire-zone');
    btn.classList.add('reloading');
    setTimeout(() => { canFire = true; btn.classList.remove('reloading'); }, 1500);
  }
});

socket.on('zoneShrink', () => { showNotif('⚠️ Storm closing in!'); });

socket.on('gameEnd', ({ winner, players }) => {
  gameStateVal = 'ended';
  show('winner');
  const wn = document.getElementById('winner-name');
  if (winner) {
    wn.textContent = winner.name;
    wn.style.color = winner.color;
  } else {
    wn.textContent = 'No survivors...';
    wn.style.color = '#aaa';
  }

  const lb = document.getElementById('leaderboard');
  lb.innerHTML = `<div class="lb-header"><span>Pirate</span><span>💀</span><span>🪙</span></div>`;
  players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row';
    row.innerHTML = `<span class="lb-rank">${i+1}</span><span class="lb-name" style="color:${p.color}">${p.name}</span><span class="lb-kills">${p.kills}</span><span class="lb-score">${p.score}</span>`;
    lb.appendChild(row);
  });
});

document.getElementById('play-again-btn').addEventListener('click', () => {
  show('lobby');
  socket.emit('startGame');
});

// ── HUD ──
function updateHUD({ hp, score, kills }) {
  document.getElementById('hud-hp').textContent = '❤️'.repeat(Math.max(0,hp)) + '🖤'.repeat(Math.max(0,3-hp));
  document.getElementById('hud-score').textContent = score || 0;
  document.getElementById('hud-kills').textContent = kills || 0;
}

function addKillFeed(msg) {
  const feed = document.getElementById('kill-feed');
  const el = document.createElement('div');
  el.className = 'kill-msg';
  el.textContent = msg;
  feed.innerHTML = '';
  feed.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showNotif(text) {
  const el = document.createElement('div');
  el.className = 'notification';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

// ── Joystick ──
const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const fireBtn = document.getElementById('fire-zone');

let joystickActive = false, joystickStart = null, joystickCurrent = { dx: 0, dy: 0 };
const MAX_RADIUS = 42;

function getJoystickCenter() {
  const r = joystickBase.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

joystickZone.addEventListener('touchstart', e => {
  // Only handle touches not on fire button
  const touch = e.changedTouches[0];
  const fireRect = fireBtn.getBoundingClientRect();
  if (touch.clientX >= fireRect.left && touch.clientY >= fireRect.top) return;
  e.preventDefault();
  joystickActive = true;
  joystickStart = getJoystickCenter();
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  if (!joystickActive) return;
  e.preventDefault();
  const touch = e.changedTouches[0];
  const center = getJoystickCenter();
  let dx = touch.clientX - center.x;
  let dy = touch.clientY - center.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > MAX_RADIUS) { dx = dx/dist*MAX_RADIUS; dy = dy/dist*MAX_RADIUS; }

  joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joystickCurrent = { dx: dx/MAX_RADIUS, dy: dy/MAX_RADIUS };
  sendInput();
}, { passive: false });

joystickZone.addEventListener('touchend', e => {
  joystickActive = false;
  joystickKnob.style.transform = 'translate(-50%,-50%)';
  joystickCurrent = { dx: 0, dy: 0 };
  sendInput();
});

// Mouse joystick fallback
let mouseJoy = false;
joystickBase.addEventListener('mousedown', e => { mouseJoy = true; });
document.addEventListener('mouseup', () => { mouseJoy = false; joystickKnob.style.transform='translate(-50%,-50%)'; joystickCurrent={dx:0,dy:0}; sendInput(); });
document.addEventListener('mousemove', e => {
  if (!mouseJoy) return;
  const center = getJoystickCenter();
  let dx = e.clientX - center.x, dy = e.clientY - center.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist > MAX_RADIUS) { dx=dx/dist*MAX_RADIUS; dy=dy/dist*MAX_RADIUS; }
  joystickKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joystickCurrent = {dx:dx/MAX_RADIUS, dy:dy/MAX_RADIUS};
  sendInput();
});

function sendInput() {
  socket.emit('input', joystickCurrent);
}

// ── Fire button ──
function doFire() {
  if (!canFire || gameStateVal !== 'playing') return;
  const dx = joystickCurrent.dx || 0;
  const dy = joystickCurrent.dy || 0;
  // fire in movement direction, or forward if not moving
  const angle = (dx !== 0 || dy !== 0) ? Math.atan2(dy, dx) : -Math.PI/2;
  fireBtn.classList.add('firing');
  setTimeout(() => fireBtn.classList.remove('firing'), 150);
  socket.emit('fire', { angle });
}

fireBtn.addEventListener('touchstart', e => { e.preventDefault(); doFire(); }, { passive: false });
fireBtn.addEventListener('mousedown', doFire);

// Keep input flowing
setInterval(sendInput, 50);
</script>
</body>
</html>
