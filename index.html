<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dead Reckoning — Join</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap');

  :root {
    --bg: #060d1a;
    --panel: #0d1f35;
    --border: rgba(201,138,26,0.4);
    --gold: #f0b429;
    --gold2: #c98a1a;
    --parchment: #f2e4c4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Crimson Pro', serif;
    color: var(--parchment);
    touch-action: none;
  }

  /* ── Screens ── */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    transition: opacity 0.4s;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ── Join ── */
  #join-screen { gap: 1.2rem; }

  .skull { font-size: 3.5rem; animation: float 2.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  h1 {
    font-family: 'Pirata One', cursive;
    font-size: 2.4rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(240,180,41,0.5);
    text-align: center;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(242,228,196,0.4);
    font-style: italic;
  }

  .name-input {
    width: 100%;
    max-width: 300px;
    padding: 0.85rem 1.2rem;
    background: var(--panel);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Pirata One', cursive;
    font-size: 1.2rem;
    color: var(--gold);
    text-align: center;
    outline: none;
  }
  .name-input::placeholder { color: rgba(201,138,26,0.3); }
  .name-input:focus { border-color: var(--gold); }

  .btn-gold {
    font-family: 'Pirata One', cursive;
    font-size: 1.3rem;
    color: #1a0f00;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    border: none;
    padding: 0.85rem 2.5rem;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
    box-shadow: 0 4px 20px rgba(240,180,41,0.3);
    transition: transform 0.1s;
  }
  .btn-gold:active { transform: scale(0.97); }

  /* ── Lobby ── */
  #lobby-screen { gap: 1rem; text-align: center; }

  .player-badge {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    border: 3px solid;
    animation: pulse-badge 2s ease-in-out infinite;
  }
  @keyframes pulse-badge { 0%,100%{box-shadow:0 0 16px currentColor} 50%{box-shadow:0 0 32px currentColor} }

  .player-name-big {
    font-family: 'Pirata One', cursive;
    font-size: 1.8rem;
  }

  .lobby-count {
    font-family: 'Pirata One', cursive;
    font-size: 1rem;
    color: var(--gold2);
    letter-spacing: 0.1em;
  }

  .lobby-status {
    font-size: 0.85rem;
    color: rgba(242,228,196,0.45);
    font-style: italic;
    animation: breathe 2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:0.4} 50%{opacity:0.9} }

  .btn-green {
    font-family: 'Pirata One', cursive;
    font-size: 1.1rem;
    color: #0a1f0a;
    background: linear-gradient(135deg, #2ecc71, #1a9e55);
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    max-width: 280px;
    box-shadow: 0 4px 16px rgba(46,204,113,0.3);
    transition: transform 0.1s;
  }
  .btn-green:active { transform: scale(0.97); }

  .hint { font-size: 0.65rem; color: rgba(242,228,196,0.2); font-style: italic; }

  /* ── Game ── */
  #game-screen { padding: 0; justify-content: flex-start; }

  #game-hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 1rem;
    background: rgba(6,13,26,0.95);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .hud-hp { font-size: 1.1rem; letter-spacing: 2px; }
  .hud-score { font-family: 'Pirata One', cursive; font-size: 1rem; color: var(--gold); }
  .hud-kills { font-family: 'Pirata One', cursive; font-size: 0.9rem; color: #e74c3c; }

  #kill-feed {
    width: 100%;
    min-height: 1.8rem;
    padding: 0.25rem 1rem;
    background: rgba(6,13,26,0.8);
    border-bottom: 1px solid rgba(201,138,26,0.1);
    flex-shrink: 0;
  }
  .kf-msg {
    font-size: 0.7rem;
    color: rgba(242,228,196,0.6);
    font-style: italic;
    animation: kf-fade 4s forwards;
  }
  @keyframes kf-fade { 0%{opacity:1} 80%{opacity:1} 100%{opacity:0} }

  #controls-area {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 1rem 1.5rem;
  }

  #joystick-base {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 2px solid rgba(201,138,26,0.25);
    background: rgba(13,31,53,0.5);
    position: relative;
    flex-shrink: 0;
    touch-action: none;
  }

  #joystick-knob {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(240,180,41,0.9), rgba(201,138,26,0.7));
    border: 2px solid var(--gold);
    box-shadow: 0 0 16px rgba(240,180,41,0.4);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  #fire-btn {
    position: absolute;
    right: 1.5rem;
    bottom: 1.5rem;
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c0392b, #7b241c);
    border: 3px solid #e74c3c;
    box-shadow: 0 0 24px rgba(231,76,60,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    touch-action: none;
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s;
    user-select: none;
  }
  #fire-btn:active, #fire-btn.firing {
    transform: scale(0.91);
    box-shadow: 0 0 40px rgba(231,76,60,0.9);
  }
  #fire-btn.reloading { opacity: 0.35; }

  #controls-hint {
    position: absolute;
    top: 0.6rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(242,228,196,0.2);
    font-style: italic;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── Dead ── */
  #dead-screen { gap: 1rem; text-align: center; }

  .dead-icon { font-size: 4rem; animation: spin 6s linear infinite; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .dead-title {
    font-family: 'Pirata One', cursive;
    font-size: 2rem;
    color: #e74c3c;
    text-shadow: 0 0 20px rgba(231,76,60,0.5);
  }

  .stats-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.5rem;
    width: 100%;
    max-width: 280px;
  }
  .stat-row { display: flex; justify-content: space-between; padding: 0.3rem 0; font-size: 0.9rem; }
  .stat-label { color: rgba(242,228,196,0.45); font-style: italic; }
  .stat-val { font-family: 'Pirata One', cursive; color: var(--gold); }

  /* ── Winner ── */
  #winner-screen { gap: 1rem; text-align: center; }

  .trophy { font-size: 3.5rem; animation: float 2s ease-in-out infinite; }

  .winner-label {
    font-family: 'Pirata One', cursive;
    font-size: 1.4rem;
    color: rgba(242,228,196,0.5);
    letter-spacing: 0.15em;
  }

  .winner-name {
    font-family: 'Pirata One', cursive;
    font-size: 2.4rem;
    text-shadow: 0 0 30px currentColor;
  }

  .leaderboard {
    width: 100%;
    max-width: 300px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .lb-head {
    background: rgba(201,138,26,0.12);
    padding: 0.4rem 1rem;
    display: flex;
    justify-content: space-between;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold2);
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.45rem 1rem;
    border-top: 1px solid rgba(201,138,26,0.08);
    font-size: 0.85rem;
  }
  .lb-rank { font-family: 'Pirata One', cursive; color: var(--gold2); width: 20px; }
  .lb-name { flex: 1; padding: 0 0.5rem; font-family: 'Pirata One', cursive; }
  .lb-kills { color: #e74c3c; font-family: 'Pirata One', cursive; width: 28px; text-align: center; }
  .lb-score { color: var(--gold); font-family: 'Pirata One', cursive; width: 40px; text-align: right; }

  /* ── Notification pop ── */
  .notif {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Pirata One', cursive;
    font-size: 1.8rem;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(240,180,41,0.8);
    pointer-events: none;
    z-index: 999;
    text-align: center;
    animation: notif-anim 0.7s ease-out forwards;
  }
  @keyframes notif-anim {
    0%  { transform: translate(-50%,-50%) scale(0.5); opacity: 0; }
    35% { transform: translate(-50%,-60%) scale(1.1); opacity: 1; }
    100%{ transform: translate(-50%,-70%) scale(1);   opacity: 0; }
  }
</style>
</head>
<body>

<!-- JOIN -->
<div class="screen" id="join-screen">
  <div class="skull">☠️</div>
  <h1>Dead<br>Reckoning</h1>
  <div class="subtitle">Pirate Battle Royale</div>
  <input class="name-input" id="name-input" type="text" placeholder="Your pirate name..."
    maxlength="16" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="btn-gold" id="join-btn">⚓ Board the Ship</button>
</div>

<!-- LOBBY -->
<div class="screen hidden" id="lobby-screen">
  <div class="player-badge" id="player-badge">🏴‍☠️</div>
  <div class="player-name-big" id="player-name-big"></div>
  <div class="lobby-count" id="lobby-count">1 pirate aboard</div>
  <div class="lobby-status" id="lobby-status">Waiting in the harbour...</div>
  <button class="btn-green" id="start-btn">⚔️ Start the Battle!</button>
  <div class="hint">anyone can start</div>
</div>

<!-- GAME -->
<div class="screen hidden" id="game-screen">
  <div id="game-hud">
    <div class="hud-hp" id="hud-hp">❤️❤️❤️</div>
    <div class="hud-score">🪙 <span id="hud-score">0</span></div>
    <div class="hud-kills">💀 <span id="hud-kills">0</span></div>
  </div>
  <div id="kill-feed"></div>
  <div id="controls-area">
    <div id="controls-hint">move · aim · fire</div>
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
    <div id="fire-btn">💣</div>
  </div>
</div>

<!-- DEAD -->
<div class="screen hidden" id="dead-screen">
  <div class="dead-icon">💀</div>
  <div class="dead-title">Ye Been Sunk!</div>
  <div class="stats-box" id="dead-stats"></div>
  <div class="lobby-status">Watching the carnage...</div>
</div>

<!-- WINNER -->
<div class="screen hidden" id="winner-screen">
  <div class="trophy">🏆</div>
  <div class="winner-label">Last Pirate Standing</div>
  <div class="winner-name" id="winner-name-el"></div>
  <div class="leaderboard" id="leaderboard"></div>
  <button class="btn-gold" id="play-again-btn" style="margin-top:0.5rem; max-width:280px">Play Again</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  let myId = null;
  let myPlayer = null;
  let currentGameState = 'lobby';
  let canFire = true;

  // ── Screen helpers ──────────────────────────────────────────────
  function show(name) {
    document.querySelectorAll('.screen').forEach(s => {
      s.classList.toggle('hidden', s.id !== name + '-screen');
    });
  }

  function showNotif(text) {
    const el = document.createElement('div');
    el.className = 'notif';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function addKillFeed(msg) {
    const feed = document.getElementById('kill-feed');
    feed.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'kf-msg';
    el.textContent = msg;
    feed.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function updateHUD(p) {
    const hp = Math.max(0, Math.min(3, p.hp));
    document.getElementById('hud-hp').textContent = '❤️'.repeat(hp) + '🖤'.repeat(3 - hp);
    document.getElementById('hud-score').textContent = p.score || 0;
    document.getElementById('hud-kills').textContent = p.kills || 0;
  }

  // ── Join ────────────────────────────────────────────────────────
  document.getElementById('join-btn').addEventListener('click', doJoin);
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doJoin();
  });

  function doJoin() {
    const name = document.getElementById('name-input').value.trim();
    socket.emit('join', { name });
  }

  socket.on('joined', ({ id, player }) => {
    myId = id;
    myPlayer = player;
    const badge = document.getElementById('player-badge');
    badge.style.color = player.color;
    badge.style.borderColor = player.color;
    document.getElementById('player-name-big').textContent = player.name;
    document.getElementById('player-name-big').style.color = player.color;
    show('lobby');
  });

  socket.on('playerJoined', ({ name, count }) => {
    document.getElementById('lobby-count').textContent =
      `${count} pirate${count !== 1 ? 's' : ''} aboard`;
    showNotif(`⚓ ${name} joined!`);
  });

  socket.on('playerLeft', ({ count }) => {
    document.getElementById('lobby-count').textContent =
      `${count} pirate${count !== 1 ? 's' : ''} aboard`;
  });

  // ── Lobby / start ───────────────────────────────────────────────
  document.getElementById('start-btn').addEventListener('click', () => {
    socket.emit('startGame');
  });

  socket.on('countdown', n => {
    const status = document.getElementById('lobby-status');
    if (n > 0) {
      status.textContent = `Battle starts in ${n}...`;
      showNotif(`${n}`);
    } else {
      showNotif('⚔️ FIGHT!');
    }
  });

  socket.on('gameStart', state => {
    currentGameState = 'playing';
    canFire = true;
    if (state.players[myId]) {
      myPlayer = state.players[myId];
      updateHUD(myPlayer);
    }
    show('game');
  });

  // ── Game ticks ──────────────────────────────────────────────────
  socket.on('tick', state => {
    if (!myId) return;
    const me = state.players[myId];
    if (me) { myPlayer = me; updateHUD(me); }
  });

  socket.on('hit', ({ targetId, hp }) => {
    if (targetId === myId) {
      if (myPlayer) myPlayer.hp = hp;
      updateHUD(myPlayer || { hp, score: 0, kills: 0 });
      showNotif('💥 HIT!');
    }
  });

  socket.on('lootPickup', ({ playerId, type, value }) => {
    if (playerId === myId) {
      showNotif(type === 'health' ? '❤️ Healed!' : `🪙 +${value}`);
    }
  });

  socket.on('fired', ({ ownerId }) => {
    if (ownerId !== myId) return;
    canFire = false;
    const btn = document.getElementById('fire-btn');
    btn.classList.add('reloading');
    setTimeout(() => {
      canFire = true;
      btn.classList.remove('reloading');
    }, 1500);
  });

  socket.on('playerDied', ({ id, killedBy }) => {
    const name = id === myId ? 'You were' : 'A pirate was';
    addKillFeed(`💀 ${name} sunk by ${killedBy}`);
    if (id === myId) {
      setTimeout(() => {
        document.getElementById('dead-stats').innerHTML = `
          <div class="stat-row"><span class="stat-label">Ships sunk</span><span class="stat-val">${myPlayer?.kills || 0}</span></div>
          <div class="stat-row"><span class="stat-label">Doubloons</span><span class="stat-val">${myPlayer?.score || 0}</span></div>
          <div class="stat-row"><span class="stat-label">Sunk by</span><span class="stat-val">${killedBy}</span></div>
        `;
        show('dead');
      }, 800);
    }
  });

  socket.on('zoneShrink', () => showNotif('⚠️ Storm!'));

  socket.on('gameEnd', ({ winner, players }) => {
    currentGameState = 'ended';
    const nameEl = document.getElementById('winner-name-el');
    if (winner) {
      nameEl.textContent = winner.name;
      nameEl.style.color = winner.color;
    } else {
      nameEl.textContent = 'No survivors...';
      nameEl.style.color = '#aaa';
    }

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = `
      <div class="lb-head">
        <span>Pirate</span><span>💀</span><span>🪙</span>
      </div>
    `;
    players.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `
        <span class="lb-rank">${i + 1}</span>
        <span class="lb-name" style="color:${p.color}">${p.name}</span>
        <span class="lb-kills">${p.kills}</span>
        <span class="lb-score">${p.score}</span>
      `;
      lb.appendChild(row);
    });

    show('winner');
  });

  document.getElementById('play-again-btn').addEventListener('click', () => {
    socket.emit('startGame');
    show('lobby');
  });

  // ── Joystick ────────────────────────────────────────────────────
  const joystickBase = document.getElementById('joystick-base');
  const joystickKnob = document.getElementById('joystick-knob');
  const fireBtn = document.getElementById('fire-btn');

  const MAX_RADIUS = 44;
  let joystickActive = false;
  let joystickVec = { dx: 0, dy: 0 };
  let joystickTouchId = null;

  function getBaseCenter() {
    const r = joystickBase.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function moveKnob(clientX, clientY) {
    const center = getBaseCenter();
    let dx = clientX - center.x;
    let dy = clientY - center.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > MAX_RADIUS) {
      dx = (dx / dist) * MAX_RADIUS;
      dy = (dy / dist) * MAX_RADIUS;
    }
    joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystickVec = { dx: dx / MAX_RADIUS, dy: dy / MAX_RADIUS };
  }

  function resetKnob() {
    joystickKnob.style.transform = 'translate(-50%, -50%)';
    joystickVec = { dx: 0, dy: 0 };
  }

  joystickBase.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joystickActive = true;
    joystickTouchId = touch.identifier;
    moveKnob(touch.clientX, touch.clientY);
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!joystickActive) return;
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        e.preventDefault();
        moveKnob(touch.clientX, touch.clientY);
        break;
      }
    }
  }, { passive: false });

  document.addEventListener('touchend', e => {
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        joystickActive = false;
        joystickTouchId = null;
        resetKnob();
        break;
      }
    }
  });

  // Mouse fallback for desktop testing
  let mouseJoy = false;
  joystickBase.addEventListener('mousedown', () => { mouseJoy = true; });
  document.addEventListener('mouseup', () => { mouseJoy = false; resetKnob(); });
  document.addEventListener('mousemove', e => {
    if (!mouseJoy) return;
    moveKnob(e.clientX, e.clientY);
  });

  // ── Fire button ─────────────────────────────────────────────────
  function doFire() {
    if (!canFire || currentGameState !== 'playing') return;
    const { dx, dy } = joystickVec;
    const angle = (dx !== 0 || dy !== 0) ? Math.atan2(dy, dx) : -Math.PI / 2;
    fireBtn.classList.add('firing');
    setTimeout(() => fireBtn.classList.remove('firing'), 150);
    socket.emit('fire', { angle });
  }

  fireBtn.addEventListener('touchstart', e => { e.preventDefault(); doFire(); }, { passive: false });
  fireBtn.addEventListener('mousedown', doFire);

  // ── Send input loop ──────────────────────────────────────────────
  setInterval(() => {
    socket.emit('input', joystickVec);
  }, 50);
</script>
</body>
</html>
